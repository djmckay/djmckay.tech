AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Proxy that turns one Doom screenshot into one Claude-chosen action (djmckay.tech/doom)

Parameters:
  AnthropicSecretName:
    Type: String
    Default: djmckay/anthropic-api-key
    Description: Name of an existing Secrets Manager secret holding the Anthropic API key (plain string)
  TypesafeSecretName:
    Type: String
    Default: djmckay/typesafe-ai-api-key
    Description: Name of a Secrets Manager secret holding the TypeSafe API key. Pass an empty string to turn the odds route off and grant it no access.
  AllowedOrigin:
    Type: String
    Default: https://djmckay.tech|https://www.djmckay.tech
    Description: Origins served and allowed by CORS, separated by | or , (e.g. https://djmckay.tech|http://localhost:8181)
  DailyCallCap:
    Type: Number
    Default: 3000
  DailyUsdCap:
    Type: Number
    Default: 5
    Description: Estimated USD of model spend per UTC day per warm instance; further requests get 429
  PerIpPerMin:
    Type: Number
    Default: 60
  Model:
    Type: String
    Default: claude-haiku-4-5-20251001
  MinesweeperEffort:
    Type: String
    Default: medium
    AllowedValues: [low, medium, high, xhigh, max]
    Description: Default thinking effort when a request does not choose one. high hit the 6000-token / 60 s limit in testing; the public presets only offer low and medium
  MinesweeperModel:
    Type: String
    Default: claude-sonnet-5
    Description: Model for Minesweeper and its post-mortems (Doom uses Model)

Conditions:
  HasTypesafeSecret: !Not [!Equals [!Ref TypesafeSecretName, ""]]

Resources:
  ResultsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: djmckay-minesweeper-results
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  DoomProxyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: djmckay-doom-proxy
      CodeUri: .
      Handler: index.handler
      Runtime: nodejs20.x
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 120 # a thinking model on a big board has been measured at 56s; the handler may also make a second, quick call
      # Hard ceiling on parallel model calls, and so on spend rate.
      ReservedConcurrentExecutions: 3
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
                - dynamodb:Query
              Resource: !GetAtt ResultsTable.Arn
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              # Secrets Manager appends a random suffix to the ARN, hence the trailing -*
              Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AnthropicSecretName}-*
        # Only attached when a TypeSafe secret name is given, so the default deploy grants nothing extra.
        - !If
          - HasTypesafeSecret
          - Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${TypesafeSecretName}-*
          - !Ref AWS::NoValue
      Environment:
        Variables:
          ANTHROPIC_SECRET_ID: !Ref AnthropicSecretName
          TYPESAFE_SECRET_ID: !Ref TypesafeSecretName
          RESULTS_TABLE: !Ref ResultsTable
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          DAILY_CALL_CAP: !Ref DailyCallCap
          DAILY_USD_CAP: !Ref DailyUsdCap
          PER_IP_PER_MIN: !Ref PerIpPerMin
          MODEL: !Ref Model
          MINESWEEPER_MODEL: !Ref MinesweeperModel
          MINESWEEPER_EFFORT: !Ref MinesweeperEffort
      # No Cors block: index.js sets the CORS headers itself, and doing both duplicates them.
      FunctionUrlConfig:
        AuthType: NONE

Outputs:
  ResultsTableName:
    Description: DynamoDB table holding per-setup Minesweeper counters (kept if the stack is deleted)
    Value: !Ref ResultsTable
  FunctionUrl:
    Description: Paste into proxyUrl in static-site/src/doom.njk
    Value: !GetAtt DoomProxyFunctionUrl.FunctionUrl
